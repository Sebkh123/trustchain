events {}

http {
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location /auth/ {
            proxy_pass http://auth-service:8000/;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://api-service:8002/;
            proxy_set_header Host $host;
        }
    }
}