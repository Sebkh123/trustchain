services:
  auth-service:
    build: ./auth-service

  api-service:
    build: ./api-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      - auth-service

  reverse-proxy:
    image: nginx
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
      - ./reverse-proxy/certs:/etc/nginx/certs
    ports:
      - "8443:443"
    depends_on:
      - auth-service
      - api-service